name: Build integrity
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build integrity (gpu {0}, extra "{1}", API {2})', inputs.gpu || 'swiftshader_indirect', inputs.emulator-extra, inputs.api-levels || 'all') || '' }}

on:
  push:
  pull_request:
  # Manual runs can compare emulator configurations: run 39131653130 lost API 24 to a surfaceflinger SIGSEGV and API 37.1
  # to a system_server abort in the image's gralloc mapper, both while the framework read back an activity screenshot on
  # the GitHub runner. Push and pull request runs keep the defaults below. Only repository writers can dispatch.
  workflow_dispatch:
    inputs:
      gpu:
        description: "Emulator -gpu mode; empty keeps swiftshader_indirect"
        required: false
        default: ""
      emulator-extra:
        description: "Extra emulator options appended to the defaults, e.g. -feature -GLDMA"
        required: false
        default: ""
      api-levels:
        description: "Comma-separated emulator API levels to run without spaces, e.g. 24,37.1; empty runs all"
        required: false
        default: ""
      full-suite:
        description: "Also run the main suite on conformance-only entries (API 37.1), e.g. to check a newer image"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Each manual run gets its own group so that several configurations can run side by side.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Unit tests and debug/release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile JVM tests, assemble and verify APKs, and run tests and lint
        run: |
          chmod +x gradlew
          # JVM test compilation must work before any APK exists.
          # The release APK is built explicitly: R8 missing-class failures only surface there.
          ./gradlew :app:assembleDebugUnitTest \
            :app:verifyNativePageAlignment :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug :app:lintRelease \
            :test-apps:fake-host:assembleDebug :test-apps:fake-host:assembleDebugAndroidTest \
            :test-apps:fake-host:lintDebug --console=plain --stacktrace

      - name: Upload debug, release, and test APKs
        uses: actions/upload-artifact@v7
        with:
          name: build-test-apks
          path: app/build/outputs/apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload test and lint reports after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            test-apps/fake-host/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  verify-contract:
    name: Plugin contract on the emulator (API ${{ matrix.api-level }}, ${{ matrix.arch }})
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only the experimental (preview image) entry may fail without failing the workflow.
    continue-on-error: ${{ matrix.experimental == true }}
    # A manual run with api-levels skips the other entries' steps (the job itself cannot read the matrix in its if).
    env:
      SELECTED: ${{ github.event_name != 'workflow_dispatch' || inputs.api-levels == '' || contains(format(',{0},', inputs.api-levels), format(',{0},', matrix.api-level)) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The API 24 image's surfaceflinger sometimes takes SIGSEGV in GraphicBuffer::flatten while the framework
          # screenshots a finishing activity, and system_server goes down with it (runs 39112487013 twice, 39131653130;
          # never locally, passed in all four runs of 69fce4ab). run_main_suite.py reruns the suite once after that.
          - api-level: 24
            arch: x86
            target: google_apis
            profile: Nexus 5
            main-suite-args: --retry-system-crash
          - api-level: 35
            arch: x86_64
            target: google_apis
            profile: pixel_7
          # Android 17 (API 37.1) only ships the 16 KB page size Google APIs image; the plugin has no native
          # libraries, so the page size does not change what the suite exercises. Its default data partition
          # is too small for the fake host ("Requested internal only, but not enough space"), hence disk-size.
          # 3-Stone AI saw lmkd kill the foreground instrumentation process right after boot at the default RAM
          # on its 16 KB image; 4096M fixed it there, hence ram-size.
          # Every later failure (runs 2026-09-30 to 2026-10-18: "Broken pipe" during installs, "before system
          # providers are installed", "Process crashed.", bindService returning false) came from system_server
          # restarting about every 22 seconds from boot on. Run 39108063528 kept the logcat: with gesture navigation
          # the launcher samples the handle region, and each sample aborts surfaceflinger in the image's gralloc
          # mapper on the GitHub runner ("Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma"); a
          # Windows host never does, so the local AVD stays up. Three-button navigation unregisters that listener,
          # hence fake-host-args. run_conformance.py also waits for a stable system_server with user 0 unlocked,
          # retries once after a restart and keeps the evidence in p7-fake-host-logcat.txt. The conformance tests
          # then pass (12/12 since 8fac09d2), but the main suite still dies around its 36th test: system_server aborts
          # on the same assertion when it copies a task snapshot of a finishing activity to memory
          # (TaskSnapshotConvertUtil.copySWBitmap), with gpu guest (falls back to lavapipe), -feature -GLDMA and
          # -feature -GLDMA,-GLDMA2 alike (runs 39133759312 to 39133773321). Until the image is fixed this entry runs the
          # conformance tests only (conformance-only; a manual run with full-suite still tries the main suite) and stays
          # non-blocking (ROADMAP session record 2026-09-28, P12).
          - api-level: 37.1
            arch: x86_64
            target: google_apis_ps16k
            profile: pixel_7
            disk-size: 4096M
            ram-size: 4096M
            fake-host-args: --three-button-navigation
            conformance-only: true
            experimental: true

    steps:
      - name: Check out repository
        if: env.SELECTED == 'true'
        uses: actions/checkout@v7

      - name: Set up Java
        if: env.SELECTED == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Enable KVM
        if: env.SELECTED == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the full instrumentation suite with an isolated fake host
        if: env.SELECTED == 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          # The runner's own defaults unless a manual run overrides the GPU mode or appends options.
          emulator-options: -no-window -gpu ${{ inputs.gpu || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim ${{ inputs.emulator-extra }}
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disk-size: ${{ matrix.disk-size }}
          # Empty for the 4 KB images, which keep the runner default.
          ram-size: ${{ matrix.ram-size }}
          avd-name: Three_Stove_Agent_Conformance_CI_${{ matrix.api-level }}
          script: |
            # Build here, not in an earlier step: run 39108063528 assembled the APKs before the emulator booted, and
            # Gradle then re-signed the Agent in this step with a different debug key (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
            chmod +x gradlew
            ./gradlew :app:assembleDebug :test-apps:fake-host:assembleDebug :test-apps:fake-host:assembleDebugAndroidTest --console=plain --stacktrace
            # The twelve independent broker-conformance tests run first; the script asserts "OK (12 tests)".
            python3 test-apps/fake-host/run_conformance.py --adb "$(command -v adb)" --serial emulator-5554 ${{ matrix.fake-host-args }}
            # Then the main suite: run_main_suite.py prepares the device through the same guards (run_conformance.py
            # --prepare-only), keeps the framework log of the whole run in build/main-suite-logcat.txt (run 39112487013
            # lost two crashes without a stack), pulls the CiUiDiagnostics captures after a failure and, with
            # --retry-system-crash, reruns once after "System has crashed". Each script line runs in its own shell.
            if [ "${{ matrix.conformance-only }}" = "true" ] && [ "${{ inputs.full-suite }}" != "true" ]; then echo "MAIN_SUITE_SKIPPED conformance-only entry (API ${{ matrix.api-level }})"; else python3 test-apps/fake-host/run_main_suite.py --adb "$(command -v adb)" --serial emulator-5554 ${{ matrix.main-suite-args }} ${{ matrix.fake-host-args }}; fi

      # The fake host diagnostics and the first main-suite reports also exist when an attempt was retried after a
      # system_server restart or crash. A job that reaches timeout-minutes ends as cancelled (run 39112487013, API 24),
      # which failure() alone would skip.
      - name: Upload instrumentation reports after a failure, a cancellation or a retried attempt
        if: env.SELECTED == 'true' && (failure() || cancelled() || hashFiles('build/p7-fake-host-logcat.txt', 'build/main-suite-attempt-1/**') != '')
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            build/ci-ui-diagnostics/
            build/p7-fake-host-android.log
            build/p7-fake-host-logcat.txt
            build/main-suite-logcat.txt
            build/main-suite-attempt-1/
          if-no-files-found: ignore
          retention-days: 7
