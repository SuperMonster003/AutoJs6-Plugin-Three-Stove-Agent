name: Build integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Unit tests and debug/release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile JVM tests, assemble and verify APKs, and run tests and lint
        run: |
          chmod +x gradlew
          # JVM test compilation must work before any APK exists.
          # The release APK is built explicitly: R8 missing-class failures only surface there.
          ./gradlew :app:assembleDebugUnitTest \
            :app:verifyNativePageAlignment :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug :app:lintRelease \
            :test-apps:fake-host:assembleDebug :test-apps:fake-host:assembleDebugAndroidTest \
            :test-apps:fake-host:lintDebug --console=plain --stacktrace

      - name: Upload debug, release, and test APKs
        uses: actions/upload-artifact@v7
        with:
          name: build-test-apks
          path: app/build/outputs/apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload test and lint reports after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            test-apps/fake-host/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  verify-contract:
    name: Plugin contract on the emulator (API ${{ matrix.api-level }}, ${{ matrix.arch }})
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only the experimental (preview image) entry may fail without failing the workflow.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            arch: x86
            target: google_apis
            profile: Nexus 5
          - api-level: 35
            arch: x86_64
            target: google_apis
            profile: pixel_7
          # Android 17 (API 37.1) only ships the 16 KB page size Google APIs image; the plugin has no native
          # libraries, so the page size does not change what the suite exercises. Its default data partition
          # is too small for the fake host ("Requested internal only, but not enough space"), hence disk-size.
          # 3-Stone AI saw lmkd kill the foreground instrumentation process right after boot at the default RAM
          # on its 16 KB image; 4096M fixed it there, hence ram-size.
          # The failures since (runs 2026-09-30 to 2026-10-18) point to system_server restarting after
          # sys.boot_completed, which a framework restart does not reset: "Failure calling service package/input:
          # Broken pipe", "before system providers are installed", "Process crashed." and finally (run 39098321934)
          # every bindService to the fake host's own service returning false. Restarting zygote on a local AVD of
          # the same build reproduces the install failure; the restart itself never happened locally (4 or 2 cores,
          # CI signer, 3 minutes after boot, starved host CPU). run_conformance.py therefore waits for a stable
          # system_server with user 0 unlocked and the services resolvable, retries once when system_server
          # restarted during an attempt and keeps the evidence in p7-fake-host-logcat.txt. The job stays
          # non-blocking until runs pass (ROADMAP session record 2026-09-28, P12).
          - api-level: 37.1
            arch: x86_64
            target: google_apis_ps16k
            profile: pixel_7
            disk-size: 4096M
            ram-size: 4096M
            experimental: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Built before the emulator boots so that the guest does not share the runner's CPUs with a cold Gradle
      # build right after boot; the API 37.1 restarts mostly surfaced as this build finished.
      - name: Assemble the APKs before the emulator boots
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :test-apps:fake-host:assembleDebug :test-apps:fake-host:assembleDebugAndroidTest --console=plain --stacktrace

      - name: Run the full instrumentation suite with an isolated fake host
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disk-size: ${{ matrix.disk-size }}
          # Empty for the 4 KB images, which keep the runner default.
          ram-size: ${{ matrix.ram-size }}
          avd-name: Three_Stove_Agent_Conformance_CI_${{ matrix.api-level }}
          script: |
            # The twelve independent broker-conformance tests run first; the script asserts "OK (12 tests)".
            python3 test-apps/fake-host/run_conformance.py --adb "$(command -v adb)" --serial emulator-5554
            # Then the same guards reinstall both APKs and prepare the device for the main suite.
            python3 test-apps/fake-host/run_conformance.py --adb "$(command -v adb)" --serial emulator-5554 --prepare-only
            # AGP uninstalls both APKs after the run, which deletes the app-specific external directory holding the
            # CiUiDiagnostics captures before the pull below; the disposable AVD is killed right after this step anyway.
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.three.stove.agent.ciDiagnostics=true -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --console=plain --stacktrace || { mkdir -p build; adb pull /sdcard/Android/data/io.github.supermonster003.autojs6.plugin.three.stove.agent/files/ci-ui-diagnostics build/ci-ui-diagnostics || true; exit 1; }

      # The fake host diagnostics also exist when an attempt was retried after a system_server restart.
      - name: Upload instrumentation reports after a failure or a retried attempt
        if: failure() || hashFiles('build/p7-fake-host-logcat.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            build/ci-ui-diagnostics/
            build/p7-fake-host-android.log
            build/p7-fake-host-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
