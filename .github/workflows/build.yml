name: Build integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Unit tests and debug/release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile JVM tests, assemble and verify APKs, and run tests and lint
        run: |
          chmod +x gradlew
          # JVM test compilation must work before any APK exists.
          # The release APK is built explicitly: R8 missing-class failures only surface there.
          ./gradlew :app:assembleDebugUnitTest \
            :app:verifyNativePageAlignment :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug :app:lintRelease \
            :test-apps:fake-host:assembleDebug :test-apps:fake-host:assembleDebugAndroidTest \
            :test-apps:fake-host:lintDebug --console=plain --stacktrace

      - name: Upload debug, release, and test APKs
        uses: actions/upload-artifact@v7
        with:
          name: build-test-apks
          path: app/build/outputs/apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload test and lint reports after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            test-apps/fake-host/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  verify-contract:
    name: Plugin contract on the emulator (API ${{ matrix.api-level }}, ${{ matrix.arch }})
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only the experimental (preview image) entry may fail without failing the workflow.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            arch: x86
            target: google_apis
            profile: Nexus 5
          - api-level: 35
            arch: x86_64
            target: google_apis
            profile: pixel_7
          # Android 17 (API 37.1) only ships the 16 KB page size Google APIs image; the plugin has no native
          # libraries, so the page size does not change what the suite exercises. Its default data partition
          # is too small for the fake host ("Requested internal only, but not enough space"), hence disk-size.
          # 3-Stone AI saw lmkd kill the foreground instrumentation process right after boot at the default RAM
          # on its 16 KB image; 4096M fixed it there, hence ram-size.
          # Every later failure (runs 2026-09-30 to 2026-10-18: "Broken pipe" during installs, "before system
          # providers are installed", "Process crashed.", bindService returning false) came from system_server
          # restarting about every 22 seconds from boot on. Run 39108063528 kept the logcat: with gesture navigation
          # the launcher samples the handle region, and each sample aborts surfaceflinger in the image's gralloc
          # mapper on the GitHub runner ("Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma"); a
          # Windows host never does, so the local AVD stays up. Three-button navigation unregisters that listener,
          # hence fake-host-args. run_conformance.py also waits for a stable system_server with user 0 unlocked,
          # retries once after a restart and keeps the evidence in p7-fake-host-logcat.txt. The job stays
          # non-blocking until runs pass (ROADMAP session record 2026-09-28, P12).
          - api-level: 37.1
            arch: x86_64
            target: google_apis_ps16k
            profile: pixel_7
            disk-size: 4096M
            ram-size: 4096M
            fake-host-args: --three-button-navigation
            experimental: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the full instrumentation suite with an isolated fake host
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disk-size: ${{ matrix.disk-size }}
          # Empty for the 4 KB images, which keep the runner default.
          ram-size: ${{ matrix.ram-size }}
          avd-name: Three_Stove_Agent_Conformance_CI_${{ matrix.api-level }}
          script: |
            # Build here, not in an earlier step: run 39108063528 assembled the APKs before the emulator booted, and
            # Gradle then re-signed the Agent in this step with a different debug key (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
            chmod +x gradlew
            ./gradlew :app:assembleDebug :test-apps:fake-host:assembleDebug :test-apps:fake-host:assembleDebugAndroidTest --console=plain --stacktrace
            # The twelve independent broker-conformance tests run first; the script asserts "OK (12 tests)".
            python3 test-apps/fake-host/run_conformance.py --adb "$(command -v adb)" --serial emulator-5554 ${{ matrix.fake-host-args }}
            # Then the same guards reinstall both APKs and prepare the device for the main suite.
            python3 test-apps/fake-host/run_conformance.py --adb "$(command -v adb)" --serial emulator-5554 --prepare-only ${{ matrix.fake-host-args }}
            # Keep the framework log of the whole main suite in the background: in run 39112487013 system_server died
            # mid-suite on API 24 and 37.1 and the reports held no stack. API 24 logcat takes one buffer per -b option.
            mkdir -p build
            adb logcat -G 16M || true
            adb logcat -v threadtime -b main -b system -b crash -b events < /dev/null > build/main-suite-logcat.txt 2>&1 &
            # AGP uninstalls both APKs after the run, which deletes the app-specific external directory holding the
            # CiUiDiagnostics captures before the pull below; the disposable AVD is killed right after this step anyway.
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.three.stove.agent.ciDiagnostics=true -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --console=plain --stacktrace || { mkdir -p build; adb pull /sdcard/Android/data/io.github.supermonster003.autojs6.plugin.three.stove.agent/files/ci-ui-diagnostics build/ci-ui-diagnostics || true; exit 1; }

      # The fake host diagnostics also exist when an attempt was retried after a system_server restart. A job that
      # reaches timeout-minutes ends as cancelled (run 39112487013, API 24), which failure() alone would skip.
      - name: Upload instrumentation reports after a failure, a cancellation or a retried attempt
        if: failure() || cancelled() || hashFiles('build/p7-fake-host-logcat.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            build/ci-ui-diagnostics/
            build/p7-fake-host-android.log
            build/p7-fake-host-logcat.txt
            build/main-suite-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
